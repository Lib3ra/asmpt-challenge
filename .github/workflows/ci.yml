name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build and test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AsmptChallenge.slnx

      - name: Build
        run: dotnet build AsmptChallenge.slnx --configuration Release --no-restore

      - name: Check formatting
        run: dotnet format AsmptChallenge.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test AsmptChallenge.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: tests/**/TestResults/*.trx
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Docker image (build, smoke test, export on main)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      IMAGE: order-manager:${{ github.sha }}
      ARCHIVE: order-manager-${{ github.sha }}.tar.gz
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build --tag "$IMAGE" .

      - name: Smoke test
        run: |
          docker run --detach --name smoke --publish 8080:8080 "$IMAGE"
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:8080/api/health; then
              echo
              docker rm --force smoke
              exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1

      - name: Export image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "$IMAGE" | gzip > "$ARCHIVE"

      - name: Upload image artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: order-manager-image-${{ github.sha }}
          path: ${{ env.ARCHIVE }}
          # The archive is already gzip-compressed.
          compression-level: 0
          retention-days: 30
